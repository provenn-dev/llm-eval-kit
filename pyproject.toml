[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-eval-kit"
version = "0.1.0"
description = "Tools for evaluating LLM prompts, model outputs, and local AI experiments"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "provenn-dev" }]
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
llm-eval = "llm_eval_kit.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
